name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KERAS_BACKEND: jax
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      # Real MIT-BIH tests need the 100 MB database; CI runs the synthetic-data suite.
      - name: Test
        run: uv run pytest -m "not mitdb" -q
