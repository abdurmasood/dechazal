<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" width="640" height="196" role="img" aria-label="Macro-F1 on 22 unseen patients: cnn1d_rr 39.3, cnn1d 36.4, alexnet 24.4">
  <!-- Dark-theme twin of macro-f1.svg; keep the two in sync. -->
  <style>
    text { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #9198a1; }
    .title, .label { fill: #e6edf3; font-weight: 600; }
    .value { fill: #e6edf3; }
    .grid { stroke: #3d444d; stroke-width: 1; }
    .err { stroke: #e6edf3; stroke-width: 1.5; }
  </style>
  <text x="0" y="16" class="title">Macro-F1 on 22 unseen patients</text>
  <text x="0" y="34">mean ± std across seeds · higher is better</text>
  <g>
    <line class="grid" x1="170" y1="50" x2="170" y2="168"/>
    <line class="grid" x1="256" y1="50" x2="256" y2="168"/>
    <line class="grid" x1="342" y1="50" x2="342" y2="168"/>
    <line class="grid" x1="428" y1="50" x2="428" y2="168"/>
    <line class="grid" x1="514" y1="50" x2="514" y2="168"/>
    <line class="grid" x1="600" y1="50" x2="600" y2="168"/>
    <text x="170" y="186" text-anchor="middle">0</text>
    <text x="256" y="186" text-anchor="middle">10</text>
    <text x="342" y="186" text-anchor="middle">20</text>
    <text x="428" y="186" text-anchor="middle">30</text>
    <text x="514" y="186" text-anchor="middle">40</text>
    <text x="600" y="186" text-anchor="middle">50</text>
  </g>
  <text x="0" y="76" class="label">cnn1d_rr</text>
  <text x="0" y="91">beat + RR intervals</text>
  <rect x="170" y="60" width="338" height="26" rx="2" fill="#4f8fd6"/>
  <line class="err" x1="495" y1="73" x2="521" y2="73"/>
  <line class="err" x1="495" y1="67" x2="495" y2="79"/>
  <line class="err" x1="521" y1="67" x2="521" y2="79"/>
  <text x="530" y="78" class="value">39.3</text>
  <text x="0" y="114" class="label">cnn1d</text>
  <text x="0" y="129">filtered beat</text>
  <rect x="170" y="98" width="313" height="26" rx="2" fill="#4f8fd6"/>
  <line class="err" x1="450" y1="111" x2="516" y2="111"/>
  <line class="err" x1="450" y1="105" x2="450" y2="117"/>
  <line class="err" x1="516" y1="105" x2="516" y2="117"/>
  <text x="524" y="116" class="value">36.4</text>
  <text x="0" y="152" class="label">alexnet (2019)</text>
  <text x="0" y="167">beat as image</text>
  <rect x="170" y="136" width="210" height="26" rx="2" fill="#3e5f86"/>
  <line class="err" x1="327" y1="149" x2="433" y2="149"/>
  <line class="err" x1="327" y1="143" x2="327" y2="155"/>
  <line class="err" x1="433" y1="143" x2="433" y2="155"/>
  <text x="441" y="154" class="value">24.4</text>
</svg>
